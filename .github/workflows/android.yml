name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_USER: ${{ secrets.VITE_SUPABASE_USER }}
          VITE_SUPABASE_PASS: ${{ secrets.VITE_SUPABASE_PASS }}
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android || npx cap sync

      - name: Generate Android APK Icon
        run: |
          npm install -D @capacitor/assets
          mkdir -p assets
          cp public/logo.png assets/icon.png
          npx @capacitor/assets generate --android

      - name: Cache Android Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Auto-increment Version Code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: Build Android App (APK Debug)
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Direktori 'android' tidak ditemukan. Pastikan platform android sudah ditambahkan (npx cap add android)."
            exit 1
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p token
          cp android/app/build/outputs/apk/debug/app-debug.apk token/Tokenku.apk

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-apk
          path: token/Tokenku.apk
